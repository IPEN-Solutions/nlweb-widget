name: CI
on: [push,pull_request]
permissions: {contents: read}
jobs:
 core:
  runs-on: ubuntu-latest
  strategy: {matrix: {python: ["3.10","3.11","3.12","3.13","3.14"]}}
  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
       persist-credentials: false
   - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
   - run: uv python install ${{ matrix.python }}
   - run: uv sync --dev --all-extras --python ${{ matrix.python }}
   - run: uv run --python ${{ matrix.python }} pytest
   - run: uv run --python ${{ matrix.python }} ruff check .
   - run: uv run --python ${{ matrix.python }} ruff format --check .
   - run: uv build
