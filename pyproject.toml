[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nlweb-widget"
version = "0.9.12"
description = "Framework-neutral NLWeb protocol widget for making authoritative domain content reachable by AI agents and AI search systems."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
dependencies = ["pydantic>=2.7,<3", "pydantic-settings>=2.3,<3", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
nlweb-widget = "nlweb_widget.cli:main"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
flask = ["flask>=3,<4"]
django = ["django>=5,<6"]
starlette = ["starlette>=0.40,<2"]
sqlite = ["sqlite-vec==0.1.8"]
postgres = ["sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.29,<1"]
neo4j = ["neo4j>=5.20,<7"]
haystack = ["haystack-ai>=2.19,<4"]
qdrant = ["qdrant-client>=1.14,<2"]
qdrant-edge = ["qdrant-edge-py>=0.8,<0.9"]
documents = ["docling>=2.50,<3"]
embeddings = ["sentence-transformers>=3.0,<6"]
semantic = ["haystack-ai>=2.19,<4", "sentence-transformers>=3.0,<6"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "anyio>=4.13,<4.14", "httpx>=0.27,<1", "ruff>=0.8,<1", "build>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "flask>=3,<4", "django>=5,<6", "starlette>=0.40,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/nlweb_widget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
